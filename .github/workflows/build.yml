name: Build
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: mkdir work && unzip -qo lananh-client-source-no-shader.zip -d work
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.12
      - name: Build
        working-directory: work
        run: gradle build --no-daemon 2>&1 | tee ../build.log
      - if: failure()
        run: grep -n -E "error:|What went wrong" -A3 build.log | head -60
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-and-jar
          path: |
            build.log
            work/build/libs/*.jar
